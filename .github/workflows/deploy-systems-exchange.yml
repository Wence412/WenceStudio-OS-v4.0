name: Deploy Systems Exchange

on:
  push:
    branches: [main]
    paths:
      - "apps/systems-exchange/**"
      - "16-systems-exchange/**"
      - "scripts/build-systems-exchange.mjs"
      - ".github/workflows/deploy-systems-exchange.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: systems-exchange-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate catalog data
        run: node scripts/build-systems-exchange.mjs apps/systems-exchange/data/systems.json
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp -R apps/systems-exchange/. _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
