asset_schema:
  required:
    - asset_id
    - title
    - asset_type
    - owner
    - version
    - status
    - purpose
    - risk_tier
    - last_reviewed
  recommended:
    - target_user
    - os_domain
    - trigger
    - inputs
    - outputs
    - tools
    - models
    - data_sources
    - permissions_required
    - external_actions
    - human_approval_points
    - dependencies
    - validation_status
    - test_procedure
    - success_criteria
    - failure_handling
    - rollback_procedure
